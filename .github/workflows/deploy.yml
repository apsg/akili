name: Test and deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v1
      - name: Install Node.js
        uses: actions/setup-node@v1
        with:
          node-version: '14.x'
      - name: Install npm dependencies
        run: npm install
      - name: Build assets
        run: npm run prod
      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@v2.1.6
        env:
          SSH_PRIVATE_KEY: ${{ secrets.KEY }}
          ARGS: "-rltgoDzvO"
          SOURCE: "/"
          REMOTE_HOST: ${{ vars.HOST }}
          REMOTE_USER: ${{ vars.USERNAME }}
          TARGET: ${{ vars.TARGET }}
          EXCLUDE: "/node_modules/, /.idea/, /.git/, /vendor/, /.github/"
      - name: Creating .env file should go here
        run: echo "Creating env file..."
      - name: Composer and migrations
        uses: JimCronqvist/action-ssh@master
        with:
          hosts: ${{ vars.USER }}@${{ secrets.HOST }}
          privateKey: ${{ secrets.KEY }}
          command: |
            cd ${{ vars.TARGET }}
            chown -R www-data:www-data .
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan cache:clear
            php artisan view:cache
            php artisan config:cache
            php artisan storage:link


